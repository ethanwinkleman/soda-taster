<!doctype html>
<!--
  Source for public/og.png — the 1200×630 card link previews show.

  Kept as HTML rather than an SVG because the wordmark and headline are set in
  Fredoka, and rasterising text through sharp/librsvg silently falls back to a
  system font. A browser screenshot renders the real typeface.

  Regenerate: node scripts/generate-og.mjs  (needs `npm i -D playwright` — it is
  not a project dependency, since only this one asset uses it).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Cherry Fizz tokens, copied from src/index.css. Keep in sync — same reason
     TastingCard inlines them: this file is rasterised, not served by Tailwind. */
  :root {
    --cream:    #fffbf7;
    --cream-2:  #fbf1e8;
    --plum-900: #1f1729;
    --plum-600: #6b6478;
    --cherry-300: #ff96b0;
    --cherry-400: #ff6b91;
    --cherry-500: #ff3d78;
    --cherry-600: #c21f45;
    --cyan-400: #5eead4;
    --cyan-500: #00c2d1;
    --amber-500: #ffc233;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px; height: 630px;
    background: var(--cream);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Cherry glow behind the phone, so the right half reads warm without a hard edge */
  .glow {
    position: absolute; top: -220px; right: -180px;
    width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%,
      rgba(255,61,120,0.22) 0%, rgba(255,61,120,0.10) 42%, rgba(255,61,120,0) 70%);
  }

  .bubble { position: absolute; border-radius: 50%; }

  .stage { position: relative; display: flex; height: 100%; align-items: center; }

  /* ── Left: the pitch ─────────────────────────────────────────── */
  .copy { width: 660px; padding: 0 0 0 72px; }

  .lockup { display: flex; align-items: center; gap: 14px; margin-bottom: 34px; }
  .mark {
    width: 60px; height: 60px; border-radius: 17px;
    background: linear-gradient(135deg, var(--cherry-400) 0%, var(--cherry-500) 55%, var(--cherry-600) 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 22px -8px rgba(255,61,120,0.6);
  }
  .wordmark {
    font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 34px;
    color: var(--plum-900); letter-spacing: 0.02em; line-height: 1;
  }

  h1 {
    font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 76px;
    line-height: 1.02; letter-spacing: -0.015em; color: var(--plum-900);
  }
  h1 .accent { color: var(--cherry-500); }

  .sub {
    margin-top: 22px; font-size: 25px; line-height: 1.42; font-weight: 500;
    color: var(--plum-600); max-width: 540px;
  }

  .chips { margin-top: 34px; display: flex; gap: 10px; }
  .chip {
    font-size: 17px; font-weight: 700; letter-spacing: 0.01em;
    padding: 10px 18px; border-radius: 999px;
    background: #fff; color: var(--plum-900);
    border: 1.5px solid var(--cherry-300);
    box-shadow: 0 2px 10px -4px rgba(26,21,35,0.10);
  }

  /* ── Right: the product ──────────────────────────────────────── */
  .device {
    position: absolute; top: 74px; right: 66px;
    width: 372px; height: 744px;
    border-radius: 46px; padding: 11px;
    background: linear-gradient(160deg, #2e2440 0%, #15101c 100%);
    box-shadow: 0 40px 70px -30px rgba(31,23,41,0.55), 0 0 0 1px rgba(31,23,41,0.08);
    transform: rotate(-6deg);
  }
  .device img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 35px; display: block; }
  /* The notch, so the frame reads as a phone at thumbnail size */
  .notch {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 118px; height: 24px; border-radius: 0 0 14px 14px; background: #15101c;
  }
</style>
</head>
<body>
  <div class="glow"></div>

  <!-- Ambient fizz — the same motif as FloatingBubbles, held still -->
  <div class="bubble" style="width:16px;height:16px;left:596px;top:132px;background:rgba(0,194,209,0.35)"></div>
  <div class="bubble" style="width:10px;height:10px;left:640px;top:206px;background:rgba(255,61,120,0.32)"></div>
  <div class="bubble" style="width:22px;height:22px;left:556px;top:474px;background:rgba(255,194,51,0.34)"></div>
  <div class="bubble" style="width:12px;height:12px;left:626px;top:548px;background:rgba(0,194,209,0.28)"></div>
  <div class="bubble" style="width:8px;height:8px;left:512px;top:70px;background:rgba(255,61,120,0.28)"></div>

  <div class="stage">
    <div class="copy">
      <div class="lockup">
        <div class="mark">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fffbf7"
               stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 8 1.75 12.28a2 2 0 0 0 2 1.72h4.54a2 2 0 0 0 2-1.72L18 8"/>
            <path d="M5 8h14"/>
            <path d="M7 15a6.47 6.47 0 0 1 5 0 6.47 6.47 0 0 0 5 0"/>
            <path d="m12 8 1-6h2"/>
          </svg>
        </div>
        <span class="wordmark">Soda Taster</span>
      </div>

      <h1>Rate every soda<br />you <span class="accent">actually</span> try.</h1>

      <p class="sub">
        Shared collections, honest scores, and a fridge that tells you what's
        worth buying again.
      </p>

      <div class="chips">
        <span class="chip">Rate together</span>
        <span class="chip">Track the fridge</span>
        <span class="chip">Free</span>
      </div>
    </div>
  </div>

  <div class="device">
    <div class="notch"></div>
    <img src="../public/shots/home.webp" alt="" />
  </div>
</body>
</html>
