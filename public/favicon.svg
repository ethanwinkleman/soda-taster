<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background: a cherry ramp (sky-400 → sky-500 → sky-600). Deliberately not the
       sky→cyan avatar gradient — pink and cyan interpolate through a muddy grey at
       this size, whereas a single-hue ramp keeps the mark readable at 32px. -->
  <defs>
    <linearGradient id="fizz" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#ff6b91"/>
      <stop offset="0.55" stop-color="#ff3d78"/>
      <stop offset="1"    stop-color="#c21f45"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#fizz)"/>

  <!-- Lucide CupSoda icon paths, scaled to fill the background with padding -->
  <g transform="translate(10, 10) scale(1.833)"
     fill="none"
     stroke="#fffbf7"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path d="m6 8 1.75 12.28a2 2 0 0 0 2 1.72h4.54a2 2 0 0 0 2-1.72L18 8"/>
    <path d="M5 8h14"/>
    <path d="M7 15a6.47 6.47 0 0 1 5 0 6.47 6.47 0 0 0 5 0"/>
    <path d="m12 8 1-6h2"/>
  </g>
</svg>
